[package]
name = "tgfx"
version = "0.3.0"
edition = "2024"
description = "Run a local fx agent through Telegram"
license = "MIT"
repository = "https://github.com/molefrog/tgfx"
default-run = "tgfx"

[dependencies]
anyhow = "1"
agent-client-protocol = { version = "=3.6.0", features = ["process", "stdio", "unstable_session_system_prompt"] }
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
comrak = { version = "=0.59.0", default-features = false }
crossterm = { version = "0.29", features = ["event-stream"] }
frankenstein = { version = "=0.52.1", features = ["client-reqwest"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "webp", "jpeg", "gif"] }
libc = "0.2"
qrcode = { version = "0.14", default-features = false }
ratatui = "=0.30.2"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls", "stream"] }
rmcp = { version = "=3.8.0", features = ["server", "transport-io"] }
rpassword = "7"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
webp = { version = "=0.3.1", default-features = false }

[dev-dependencies]
axum = "0.8"

[profile.release]
lto = "thin"
strip = "symbols"

[[bin]]
name = "tgfx"
path = "src/main.rs"
